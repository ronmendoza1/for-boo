<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Boo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <div class="heart">💕</div>
        <h1>I love you, Boo!</h1>
        <p class="since">... Since the day we met in July 27, 2020</p>

        <div class="timer">
            <div class="box"><span id="years">0</span><small>years</small></div>
            <div class="box"><span id="months">0</span><small>months</small></div>
            <div class="box"><span id="days">0</span><small>days</small></div>
            <div class="box"><span id="hours">00</span><small>hours</small></div>
            <div class="box"><span id="minutes">00</span><small>minutes</small></div>
            <div class="box"><span id="seconds">00</span><small>seconds</small></div>
        </div>

        <p class="closing">And to many more to come! 💖</p>
    </main>

    <script>
        const START = new Date(2020, 7, 27, 0, 0, 0);
        const MS_SECOND = 1000;
        const MS_MINUTE = MS_SECOND * 60;
        const MS_HOUR = MS_MINUTE * 60;
        const MS_DAY = MS_HOUR * 24;
        const el = id => document.getElementById(id);

        function update() {
            const now = new Date();

            let totalMonths =
                (now.getFullYear() - START.getFullYear()) * 12 +
                (now.getMonth() - START.getMonth());

            let anchor = new Date(START.getFullYear(), START.getMonth() + totalMonths, START.getDate());
            if (anchor > now) {
                totalMonths--;
                anchor = new Date(START.getFullYear(), START.getMonth() + totalMonths, START.getDate());
            }

            let diff = now - anchor;
            const days = Math.floor(diff / MS_DAY);       diff -= days * MS_DAY;
            const hours = Math.floor(diff / MS_HOUR);     diff -= hours * MS_HOUR;
            const minutes = Math.floor(diff / MS_MINUTE); diff -= minutes * MS_MINUTE;
            const seconds = Math.floor(diff / MS_SECOND);

            el("years").textContent = Math.floor(totalMonths / 12);
            el("months").textContent = totalMonths % 12;
            el("days").textContent = days;
            el("hours").textContent = String(hours).padStart(2, "0");
            el("minutes").textContent = String(minutes).padStart(2, "0");
            el("seconds").textContent = String(seconds).padStart(2, "0");
        }

        update();
        setInterval(update, 1000);
    </script>
</body>
</html>
